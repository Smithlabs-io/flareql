name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: linux-amd64
          - platform: linux/arm64
            suffix: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM python:3.12-slim AS build
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends binutils && rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir pyinstaller
          COPY flareql.py .
          RUN pyinstaller --onefile --name flareql flareql.py

          FROM scratch
          COPY --from=build /app/dist/flareql /flareql
          EOF

      - name: Build executable with buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=./out

      - name: Stage binary with platform suffix
        run: mv ./out/flareql ./flareql-${{ matrix.suffix }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: flareql-${{ matrix.suffix }}
          path: flareql-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from branch name
        id: ver
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="v${BRANCH#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create repo archive
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="flareql-${VERSION}/" \
            HEAD \
            -o "dist/flareql-${VERSION}.tar.gz"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "$VERSION" dist/* \
            --title "flareql $VERSION" \
            --generate-notes
