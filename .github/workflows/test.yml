name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: pip install coverage

      - name: Run test suite with coverage
        run: coverage run -m unittest test_flareql.py -v

      - name: Generate coverage report
        run: coverage report -m

      - name: Extract coverage percentage
        id: cov
        run: |
          PCT=$(coverage report --format=total)
          echo "pct=$PCT" >> $GITHUB_OUTPUT
          if   [ "$PCT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$PCT" -ge 75 ]; then COLOR=green
          elif [ "$PCT" -ge 60 ]; then COLOR=yellow
          else                         COLOR=red
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Post coverage badge as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const pct   = '${{ steps.cov.outputs.pct }}';
            const color = '${{ steps.cov.outputs.color }}';
            const badge = `![coverage](https://img.shields.io/badge/coverage-${pct}%25-${color}?style=flat-square)`;
            const body  = `## Test Coverage\n\n${badge}\n\n**${pct}%** line coverage`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## Test Coverage')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
